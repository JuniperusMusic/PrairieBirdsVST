name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-${{ runner.os }}

      # Ninja + the MSVC environment works with whichever Visual Studio the
      # runner image has, instead of naming one version.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      # Compiler errors as annotations, readable from the run page and the API.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error C[0-9]+|error LNK[0-9]+|fatal error" build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::${line//$'\r'/}"
          done

      - name: Test engine
        shell: bash
        run: |
          pip install numpy scipy soundfile
          PBV_RENDER="build/tools/render/pbv_render.exe" python -m unittest discover tests -v

      - name: Test plugin (MIDI learn, saved mappings, presets)
        run: ctest --test-dir build -R plugin_tests --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r "build/plugin/PrairieBirdVoice_artefacts/Release/VST3/Prairie Bird Voice.vst3" dist/
          cp build/tools/render/pbv_render.exe dist/
          cp -r presets dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PrairieBirdVoice-windows
          path: dist

  linux-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine and render tool
        run: |
          cmake -S . -B build -DPBV_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: |
          pip install numpy scipy soundfile
          PBV_RENDER=build/tools/render/pbv_render python -m unittest discover tests -v
