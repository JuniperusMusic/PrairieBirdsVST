name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test engine
        shell: bash
        run: |
          pip install numpy scipy soundfile
          PBV_RENDER="build/tools/render/Release/pbv_render.exe" python -m unittest discover tests -v

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r "build/plugin/PrairieBirdVoice_artefacts/Release/VST3/Prairie Bird Voice.vst3" dist/
          cp build/tools/render/Release/pbv_render.exe dist/
          cp -r presets dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PrairieBirdVoice-windows
          path: dist

  linux-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine and render tool
        run: |
          cmake -S . -B build -DPBV_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: |
          pip install numpy scipy soundfile
          PBV_RENDER=build/tools/render/pbv_render python -m unittest discover tests -v
